<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="Memory with 10 sessions at once">
<style>svg{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.bg{fill:#fcfcfb}.t1{fill:#1d1d1b}.t2{fill:#5f5e58}.axis{stroke:#e2e1dc}.s-rsh{fill:#2a78d6}.s-rsh_tcp{fill:#eb6834}.s-ssh{fill:#1baf7a}.s-et{fill:#eda100}.s-mosh{fill:#e87ba4}@media (prefers-color-scheme:dark){.bg{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.axis{stroke:#3a3a37}.s-rsh{fill:#3987e5}.s-rsh_tcp{fill:#d95926}.s-ssh{fill:#199e70}.s-et{fill:#c98500}.s-mosh{fill:#d55181}}</style>
<rect class="bg" width="100%" height="100%" rx="8"/>
<text class="t1" x="16" y="26" font-size="15" font-weight="600">Memory with 10 sessions at once</text>
<text class="t2" x="16" y="44" font-size="11.5">each shell having printed 3000 lines, then quiet; resident memory, all processes (lower is better)</text>
<rect class="s-rsh" x="16" y="56" width="10" height="10" rx="2"/>
<text class="t2" x="30" y="65" font-size="11.5">rsh (UDP)</text>
<rect class="s-rsh_tcp" x="112" y="56" width="10" height="10" rx="2"/>
<text class="t2" x="126" y="65" font-size="11.5">rsh (TCP)</text>
<rect class="s-ssh" x="209" y="56" width="10" height="10" rx="2"/>
<text class="t2" x="223" y="65" font-size="11.5">OpenSSH</text>
<rect class="s-et" x="292" y="56" width="10" height="10" rx="2"/>
<text class="t2" x="306" y="65" font-size="11.5">ET</text>
<rect class="s-mosh" x="338" y="56" width="10" height="10" rx="2"/>
<text class="t2" x="352" y="65" font-size="11.5">mosh</text>
<text class="t1" x="16" y="90" font-size="12" font-weight="600">Clients, all of them</text>
<line class="axis" x1="108" y1="96" x2="108" y2="163" stroke-width="1"/>
<text class="t2" x="102" y="107" font-size="11" text-anchor="end">rsh (UDP)</text>
<rect class="s-rsh" x="108" y="98" width="86.8" height="11" rx="2"/>
<text class="t1" x="200.8" y="107" font-size="11">25.0 MiB</text>
<text class="t2" x="102" y="120" font-size="11" text-anchor="end">rsh (TCP)</text>
<rect class="s-rsh_tcp" x="108" y="111" width="81.8" height="11" rx="2"/>
<text class="t1" x="195.8" y="120" font-size="11" font-weight="600">23.6 MiB</text>
<text class="t2" x="102" y="133" font-size="11" text-anchor="end">OpenSSH</text>
<rect class="s-ssh" x="108" y="124" width="254.5" height="11" rx="2"/>
<text class="t1" x="368.5" y="133" font-size="11">73.4 MiB</text>
<text class="t2" x="102" y="146" font-size="11" text-anchor="end">ET</text>
<rect class="s-et" x="108" y="137" width="574.0" height="11" rx="2"/>
<text class="t1" x="688.0" y="146" font-size="11">165.5 MiB</text>
<text class="t2" x="102" y="159" font-size="11" text-anchor="end">mosh</text>
<rect class="s-mosh" x="108" y="150" width="500.4" height="11" rx="2"/>
<text class="t1" x="614.4" y="159" font-size="11">144.3 MiB</text>
<text class="t1" x="16" y="191" font-size="12" font-weight="600">Server side, all of it</text>
<line class="axis" x1="108" y1="197" x2="108" y2="264" stroke-width="1"/>
<text class="t2" x="102" y="208" font-size="11" text-anchor="end">rsh (UDP)</text>
<rect class="s-rsh" x="108" y="199" width="30.1" height="11" rx="2"/>
<text class="t1" x="144.1" y="208" font-size="11">8.7 MiB</text>
<text class="t2" x="102" y="221" font-size="11" text-anchor="end">rsh (TCP)</text>
<rect class="s-rsh_tcp" x="108" y="212" width="29.8" height="11" rx="2"/>
<text class="t1" x="143.8" y="221" font-size="11" font-weight="600">8.6 MiB</text>
<text class="t2" x="102" y="234" font-size="11" text-anchor="end">OpenSSH</text>
<rect class="s-ssh" x="108" y="225" width="510.3" height="11" rx="2"/>
<text class="t1" x="624.3" y="234" font-size="11">147.2 MiB</text>
<text class="t2" x="102" y="247" font-size="11" text-anchor="end">ET</text>
<rect class="s-et" x="108" y="238" width="124.4" height="11" rx="2"/>
<text class="t1" x="238.4" y="247" font-size="11">35.9 MiB</text>
<text class="t2" x="102" y="260" font-size="11" text-anchor="end">mosh</text>
<rect class="s-mosh" x="108" y="251" width="342.4" height="11" rx="2"/>
<text class="t1" x="456.4" y="260" font-size="11">98.8 MiB</text>
</svg>