<text class="t2" x="126" y="65" font-size="11.5">12 workers</text>
<text class="t1" x="16" y="90" font-size="12" font-weight="600">RTT 100 ms · bandwidth</text>
<line class="axis" x1="108" y1="96" x2="108" y2="124" stroke-width="1"/>
<text class="t2" x="102" y="107" font-size="11" text-anchor="end">4 workers</text>
<rect class="s-baseline" x="108" y="98" width="477.0" height="11" rx="2" opacity="0.3"/>
<rect class="s-baseline" x="108" y="98" width="375.4" height="11" rx="2" opacity="0.6"/>
<rect class="s-baseline" x="108" y="98" width="224.0" height="11" rx="2"/>
<text class="t1" x="591.0" y="107" font-size="11" font-weight="600">58.01 / 27.25 / 45.66</text>
<text class="t2" x="102" y="120" font-size="11" text-anchor="end">12 workers</text>
<rect class="s-parallel12" x="108" y="111" width="474.2" height="11" rx="2" opacity="0.3"/>
<rect class="s-parallel12" x="108" y="111" width="345.5" height="11" rx="2" opacity="0.6"/>
<rect class="s-parallel12" x="108" y="111" width="192.1" height="11" rx="2"/>
<text class="t1" x="588.2" y="120" font-size="11">57.67 / 23.36 / 42.02</text>
<text class="t1" x="16" y="152" font-size="12" font-weight="600">256 kbit/s · RTT 400 ms · 2% loss · compress</text>
<line class="axis" x1="108" y1="158" x2="108" y2="186" stroke-width="1"/>
<text class="t2" x="102" y="169" font-size="11" text-anchor="end">4 workers</text>
<rect class="s-baseline" x="108" y="160" width="229.6" height="11" rx="2" opacity="0.3"/>
