<text class="t1" x="384.5" y="169" font-size="11" font-weight="600">27.92 / 1.72 / 32.89</text>
<text class="t2" x="102" y="182" font-size="11" text-anchor="end">12 workers</text>
<rect class="s-parallel12" x="108" y="173" width="225.9" height="11" rx="2" opacity="0.3"/>
<rect class="s-parallel12" x="108" y="173" width="275.9" height="11" rx="2" opacity="0.6"/>
