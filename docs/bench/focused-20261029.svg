<svg xmlns="http://www.w3.org/2000/svg" width="760" height="222" viewBox="0 0 760 222" role="img" aria-label="Focused rsh UDP repeat: 4 versus 12 workers">
<style>svg{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.bg{fill:#fcfcfb}.t1{fill:#1d1d1b}.t2{fill:#5f5e58}.axis{stroke:#e2e1dc}.s-baseline{fill:#2a78d6}.s-parallel12{fill:#eb6834}@media (prefers-color-scheme:dark){.bg{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.axis{stroke:#3a3a37}.s-baseline{fill:#3987e5}.s-parallel12{fill:#d95926}}</style>
<rect class="bg" width="100%" height="100%" rx="8"/>
<text class="t1" x="16" y="26" font-size="15" font-weight="600">Focused rsh UDP repeat: 4 versus 12 workers</text>
<text class="t2" x="16" y="44" font-size="11.5">36 attempts / 3 blocks per group; light: mean FPS, mid: 5% low, solid: 1% low (higher is better)</text>
